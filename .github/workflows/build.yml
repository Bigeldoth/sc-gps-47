name: Build SpaceDrive GPS

# PRs     → build only (smoke test, no upload)
# Tag v*  → build + upload to VPS + create GitHub Release with VPS download link

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\tools\build_installer.ps1

      - name: Upload installer to VPS
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_RELEASES_PATH: /var/www/spacedrive/releases
          VPS_KEEP_VERSIONS: "5"
        run: |
          pip install paramiko
          python tools/upload_vps.py "dist/SpaceDrive-Setup-*.exe"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Download

            **[SpaceDrive-Setup-${{ github.ref_name }}.exe](${{ vars.VPS_PUBLIC_URL }}/SpaceDrive-Setup-${{ github.ref_name }}.exe)**

            Hosted on VPS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
