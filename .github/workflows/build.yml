name: Build SpaceDrive GPS

# PRs     → build only (smoke test, no upload)
# Tag v*  → build + upload to VPS + create GitHub Release with VPS download link

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\tools\build_installer.ps1

      - name: Upload installer to VPS
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/SpaceDrive-Setup-*.exe"
          target: /var/www/spacedrive/releases/
          strip_components: 1

      - name: Update latest.json and prune old releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            RELEASES=/var/www/spacedrive/releases
            PUBLIC_URL="${{ vars.VPS_PUBLIC_URL }}"
            LATEST=$(ls -t $RELEASES/SpaceDrive-Setup-*.exe 2>/dev/null | head -1)
            FILENAME=$(basename "$LATEST")
            VERSION="${FILENAME#SpaceDrive-Setup-}"
            VERSION="${VERSION%.exe}"
            printf '{\n  "version": "%s",\n  "url": "%s/%s",\n  "date": "%s"\n}\n' \
              "$VERSION" "${PUBLIC_URL%/}" "$FILENAME" "$(date +%Y-%m-%d)" \
              > $RELEASES/latest.json
            ls -t $RELEASES/SpaceDrive-Setup-*.exe | tail -n +6 | xargs -r rm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Download

            **[SpaceDrive-Setup-${{ github.ref_name }}.exe](${{ vars.VPS_PUBLIC_URL }}/SpaceDrive-Setup-${{ github.ref_name }}.exe)**

            Hosted on VPS.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
