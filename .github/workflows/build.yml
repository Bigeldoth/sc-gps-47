name: Build SpaceDrive GPS

# Releases are published locally with tools/release.ps1. CI never publishes.
on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest paramiko
      - name: Check synchronized versions
        run: python tools/versioning.py check
      - name: Run tests
        run: python -m pytest tests -q
      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\tools\build_installer.ps1
