name: Build SpaceDrive GPS

# PRs     → build only (smoke test, no upload)
# Tag v*  → build + upload to R2 + create GitHub Release with R2 download link

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\tools\build_installer.ps1

      - name: Upload installer to R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          pip install boto3
          python tools/upload_r2.py "dist/SpaceDrive-Setup-*.exe"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Download

            **[SpaceDrive-Setup-${{ github.ref_name }}.exe](${{ vars.CF_R2_PUBLIC_URL }}/SpaceDrive-Setup-${{ github.ref_name }}.exe)**

            Hosted on Cloudflare R2.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
