name: Build SpaceDrive GPS

# Build the PyInstaller bundle + Inno Setup installer on every push to main
# and on every PR. Publish a GitHub Release with the installer attached only
# when a tag matching v* is pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (PyInstaller + Inno Setup)
        shell: pwsh
        run: .\tools\build_installer.ps1

      - name: Upload installer to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          pip install boto3
          python << 'EOF'
          import boto3
          import glob
          import os
          import sys

          account_id = os.environ['CF_ACCOUNT_ID']
          access_key = os.environ['CF_R2_ACCESS_KEY_ID']
          secret_key = os.environ['CF_R2_SECRET_ACCESS_KEY']

          s3 = boto3.client(
              's3',
              endpoint_url=f'https://{account_id}.r2.cloudflarestorage.com',
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              region_name='auto'
          )

          files = glob.glob('dist/SpaceDrive-Setup-*.exe')
          if not files:
              print('Error: No installer found in dist/', file=sys.stderr)
              sys.exit(1)

          for file_path in files:
              file_name = os.path.basename(file_path)
              try:
                  s3.upload_file(file_path, 'spacedrive', file_name)
                  print(f'Uploaded: {file_name}')
              except Exception as e:
                  print(f'Error uploading {file_name}: {e}', file=sys.stderr)
                  sys.exit(1)

          print('All files uploaded to R2 successfully')
          EOF

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpaceDrive-Setup
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceDrive-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
