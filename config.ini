[Logging]
level = INFO
file = spacedrive.log

[Debug]
save_ocr_images = False
save_glyph_crops = False
verbose_mode = False
test_screenshot =
# Record a per-tick navigation trace (positions, dropouts, rejects) to
# logs/telemetry-*.jsonl for offline replay / filter tuning. Off by default.
record_telemetry = False

[Features]
interactive_mode = True
poi_management = True

[OCR]
tesseract_path = C:\Program Files\Tesseract-OCR\tesseract.exe
scan_interval_ms = 200
glyph_engine = onnx
onnx_model_path = models/spacedrive_ocr.onnx
onnx_classes_path = models/spacedrive_ocr.classes.json
onnx_confidence_threshold = 0.85
text_engine = tesseract
pipeline_mode = hybrid
paddle_device = cpu

[Settings]
refresh_interval_ms = 200

[Overlay]
default_opacity = 1.00
default_position_x = 50
default_position_y = 50
show_status_bar = True

[Hotkeys]
toggle_overlay = shift+f1
open_options = shift+f2
save_position = shift+f3
open_poi_manager = shift+f4
reset_gps_nav = shift+f5

[Navigation]
arrival_radius_m = 100.0

[Kalman]
# Advanced tuning for the constant-velocity Kalman filter that derives the
# movement heading from the OCR position stream (VelocityTracker). Tune from
# Options -> Navigation -> Filter tuning. Defaults are seeded from live telemetry.
# Physical speed ceiling in km/s (velocity clamp + bounded init).
max_speed_km_s = 2.5
# Acceleration process-noise std (km/s^2); higher follows turns faster, noisier.
sigma_a = 1.0
# Per-axis measurement (position) noise std in km; higher smooths more.
sigma_z = 0.02
# Innovation-gate (NIS) threshold above which a sample is rejected as a misread.
gate_nis = 30.0
# Dead-reckoning coast window in seconds before integrity degrades to LOST.
coast_s = 2.0

