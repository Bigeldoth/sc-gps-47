[Logging]
level = DEBUG
file = spacedrive.log

[Debug]
capture_screenshot = False
save_ocr_images = True
save_glyph_crops = False
verbose_mode = True
test_screenshot = 

[Features]
interactive_mode = True
poi_management = True

[OCR]
tesseract_path = /opt/homebrew/bin/tesseract
scan_interval_ms = 200
glyph_engine = onnx
onnx_model_path = models/spacedrive_ocr.onnx
onnx_classes_path = models/spacedrive_ocr.classes.json
onnx_confidence_threshold = 0.85
text_engine = tesseract
pipeline_mode = hybrid
paddle_device = gpu
# paddle_model_dir disabled — the 153-sample fine-tune from record2.mp4
# caused catastrophic forgetting (model outputs '0' and spaces). Re-enable
# only after training on a larger, more diverse dataset (multiple gameplay
# clips covering different zones/lighting). Path kept as comment:
# paddle_model_dir = models/paddle/rec_finetuned/best_accuracy/inference

[Settings]
refresh_interval_ms = 1000

[Overlay]
default_opacity = 0.70
default_position_x = 50
default_position_y = 50
show_status_bar = True

[Hotkeys]
toggle_overlay = shift+f1
open_options = shift+f2
save_position = shift+f3
open_poi_manager = shift+f4

[Navigation]
arrival_radius_m = 100.0

