[Logging]
level = DEBUG
file = spacedrive.log

[Debug]
capture_screenshot = False
save_ocr_images = True
save_glyph_crops = False
verbose_mode = True
test_screenshot = 

[Features]
interactive_mode = True
poi_management = True

[OCR]
tesseract_path = /opt/homebrew/bin/tesseract
scan_interval_ms = 200
glyph_engine = onnx
onnx_model_path = models/spacedrive_ocr.onnx
onnx_classes_path = models/spacedrive_ocr.classes.json
onnx_confidence_threshold = 0.85
text_engine = tesseract
pipeline_mode = hybrid
paddle_device = gpu
# Paddle fine-tunes (153-sample run + 1964-sample 30-epoch GPU run) both
# collapse to outputting 'D' or '0' at inference despite reasonable val
# metrics during training. Training is per-row crops, inference is the
# full 600x45 HUD via PP-OCRv4 det → the rec model never sees the live
# crop geometry. Sticking with Tesseract + F1-F5 noise gates (~50%+
# accept rate measured on record2.mp4) until the train/eval/inference
# preprocessing mismatch is resolved.
# paddle_model_dir = models/paddle/rec_finetuned/iter_epoch_16/inference

[Settings]
refresh_interval_ms = 1000

[Overlay]
default_opacity = 0.70
default_position_x = 50
default_position_y = 50
show_status_bar = True

[Hotkeys]
toggle_overlay = shift+f1
open_options = shift+f2
save_position = shift+f3
open_poi_manager = shift+f4
stop_navigation = shift+f5

[Navigation]
arrival_radius_m = 100.0

